   <h1>telegram-digest</h1>
   <p>Private tool used only by its owner. It inserts a daily digest of the owner's
   Telegram bot messages into the owner's own Gmail inbox (scope gmail.insert).
   No data is shared with anyone, stored elsewhere, or used for any other purpose.</p>
